		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

	<script>
// PATCHED by tools/publish_web.sh -- register the service worker under a URL that changes
// every minute. The browser checks for a new worker at the registered URL, and the GitHub
// Pages CDN (max-age=600) would otherwise keep answering with the previous build's worker
// for up to ten minutes. Registered here, before the engine loads, and again whenever the
// app returns to the foreground. GODOT_CONFIG below points the engine at the same URL, so
// the two registrations never fight over which worker is current.
const SW_URL = 'index.service.worker.js?t=' + Math.floor(Date.now() / 60000);
if ('serviceWorker' in navigator) {
	const lookForNewBuild = (url) => navigator.serviceWorker.register(url).catch(() => {});
	lookForNewBuild(SW_URL);
	document.addEventListener('visibilitychange', () => {
		if (document.visibilityState === 'visible') {
			lookForNewBuild('index.service.worker.js?t=' + Math.floor(Date.now() / 60000));
		}
	});
	// a new build is on the device (its worker fetched all of it in the background): still
	// on the splash, nothing to lose -- reload onto it; playing, offer it, never force it
	navigator.serviceWorker.addEventListener('message', (e) => {
		if (!e.data || e.data.type !== 'new-build') {
			return;
		}
		if (document.getElementById('status')) {   // (Godot removes the splash once running)
			window.location.reload();
			return;
		}
		if (document.getElementById('new-build')) {
			return;
		}
		const b = document.createElement('div');
		b.id = 'new-build';
		b.textContent = 'new version ready — tap to restart';
		b.style.cssText = 'position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:10;'
			+ 'padding:6px 4px 6px 14px;border-radius:16px;background:rgba(8,8,20,0.85);color:#fff;'
			+ 'border:1px solid rgba(110,220,255,0.85);box-shadow:0 0 10px rgba(110,220,255,0.5);'
			+ 'font:14px sans-serif;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none';
		b.addEventListener('click', () => window.location.reload());
		const x = document.createElement('span');   // (later: the next launch is the new build anyway)
		x.textContent = '×';
		x.style.cssText = 'margin-left:6px;padding:0 10px;opacity:0.7';
		x.addEventListener('click', (e2) => {
			e2.stopPropagation();
			b.remove();
		});
		b.appendChild(x);
		document.body.appendChild(b);
	});
}
// a first visit: no worker controls the page yet, so the engine would fetch its two big files
// past it, uncached, and the next visit would download them again. Wait for the worker to
// take the page over (a second or so; at most 4) so they go into its cache on the way.
const SW_READY = (!('serviceWorker' in navigator) || navigator.serviceWorker.controller) ? Promise.resolve()
	: new Promise((ok) => {
		navigator.serviceWorker.addEventListener('controllerchange', () => ok(), { once: true });
		setTimeout(ok, 4000);
	});
</script>
<script>
// PATCHED by tools/publish_web.sh -- Godot's never-drawn default lit programs compiled as an
// empty placeholder (see the comment there). Before the engine starts, so its own default
// material is covered too.
(() => {
	if (window.__lstrip || typeof WebGL2RenderingContext === 'undefined') return;
	const c = window.__lstrip = { n: 0, used: 0 };
	const P = WebGL2RenderingContext.prototype;
	const types = new WeakMap(), fake = new WeakSet(), fakeProg = new WeakSet();
	const cs = P.createShader, ss = P.shaderSource, as = P.attachShader, up = P.useProgram;
	P.createShader = function (t) { const sh = cs.call(this, t); if (sh) types.set(sh, t); return sh; };
	P.shaderSource = function (sh, src) {
		if (typeof src === 'string' && src.indexOf('#define BASE_PASS') >= 0
				&& src.indexOf('#define USE_ADDITIVE_LIGHTING') < 0 && src.indexOf('#define DISABLE_LIGHT_OMNI') < 0) {
			const v = src.slice(0, src.indexOf('\n'));
			src = types.get(sh) === this.VERTEX_SHADER
				? v + '\nvoid main() { gl_Position = vec4(0.0); }\n'
				: v + '\nprecision mediump float;\nout vec4 frag_color;\nvoid main() { frag_color = vec4(1.0, 0.0, 1.0, 1.0); }\n';
			fake.add(sh);
			if (types.get(sh) !== this.VERTEX_SHADER) c.n += 1;
		}
		return ss.call(this, sh, src);
	};
	P.attachShader = function (p, sh) { if (fake.has(sh)) fakeProg.add(p); return as.call(this, p, sh); };
	let cur = null;
	P.useProgram = function (p) { cur = p; return up.call(this, p); };
	for (const name of ['drawArrays', 'drawElements', 'drawArraysInstanced', 'drawElementsInstanced', 'drawRangeElements']) {
		const d = P[name];
		P[name] = function (...a) {
			if (cur && fakeProg.has(cur) && c.used++ === 0) console.warn('never-drawn placeholder program was drawn with');
			return d.apply(this, a);
		};
	}
})();

const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
const GODOT_PACKS = ["index.art.cfe2ffb3f97d.pck", "index.data_annecy.0c7f6c7b8454.pck", "index.data_ashdod.4119206654df.pck", "index.data_bedford.9945a55ecd40.pck", "index.data_delft.096aa57972be.pck", "index.data_dimyon.17f6f534e837.pck", "index.data_givatayim.ecf618adf328.pck", "index.data_leiden.8d7a894350cc.pck", "index.data_monaco.658b880ba4f1.pck", "index.data_tel_aviv.c6b29a60153f.pck", "index.data_trick_road.5c9ecd5173be.pck", "index.sound.ff6f6a63df21.pck"];
// PATCHED by tools/publish_web.sh -- engine.startGame(), but the split packs downloaded with

function startWithPacks(override) {
	engine.config.update(override);
	engine.config.args = ['--main-pack', 'index.pck'].concat(engine.config.args);
	return Promise.all([engine.init(GODOT_CONFIG['executable'])].concat(

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		SW_READY.then(() => startWithPacks({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
