# Bakes a real place from OpenStreetMap into a city file (tools/osm_city.py) on GitHub's
# own machines, which can reach the Overpass servers whatever network you or a cloud
# session are on, and commits the file to the branch it was run on. Run it from the
# Actions tab ("Run workflow"), with `gh workflow run bake_city.yml -f place=... -f out=...`,
# or ask the AI to. A big city whole is too much to drive: give `bbox` (south,west,north,east)
# to bake a few of its neighbourhoods, `place` then being only the name it goes by. Run on main, it also re-publishes the web build, because a commit
# made by a workflow does not set off publish.yml by itself.
name: bake a real city

on:
  workflow_dispatch:
    inputs:
      place:
        description: "The town as OpenStreetMap names it, any language (Givatayim, גבעתיים, Ramat Gan)"
        required: true
      out:
        description: "Where the city file goes: game/<game>/cities/<city>.json"
        required: true
      margin:
        description: "Metres of the neighbouring towns kept round the edge"
        default: "250"
      include:
        description: "Optional: more places to take in, ';'-separated (a park, a lake, a street near the place)"
        default: ""
      origin:
        description: "Optional: lat,lon the metres are measured from -- the old file's \"origin\" when growing a bbox, so every place keeps its coordinates"
        default: ""
      bbox:
        description: "Optional: south,west,north,east in degrees -- bake this box instead of the whole town (a few neighbourhoods of a big city); place is then only its name"
        default: ""
      bare_ground:
        description: "Take buildings out of the ground heights (a city of towers otherwise stands on hills of its own roofs)"
        type: boolean
        default: false
      main_server_only:
        description: "Ask only overpass-api.de, waiting and retrying when it is busy, never a mirror (a mirror can answer with older data: compare a re-bake's counts with the file it replaces)"
        type: boolean
        default: false

concurrency:
  group: bake-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bake
        env:
          PLACE: ${{ inputs.place }}
          OUT: ${{ inputs.out }}
          MARGIN: ${{ inputs.margin }}
          INCLUDE: ${{ inputs.include }}
          BBOX: ${{ inputs.bbox }}
          ORIGIN: ${{ inputs.origin }}
          BARE: ${{ inputs.bare_ground }}
          OVERPASS_URL: ${{ inputs.main_server_only && 'https://overpass-api.de/api/interpreter' || '' }}
        run: |
          if ! [[ "$OUT" =~ ^game/[A-Za-z0-9_-]+/[A-Za-z0-9_/-]+\.json$ ]]; then
            echo "out must be a .json path inside a game folder, got: $OUT"; exit 1
          fi
          if ! [[ "$MARGIN" =~ ^[0-9]+$ ]]; then
            echo "margin must be a whole number of metres, got: $MARGIN"; exit 1
          fi
          if [ -n "$BBOX" ]; then
            if ! [[ "$BBOX" =~ ^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$ ]]; then
              echo "bbox must be south,west,north,east in degrees, got: $BBOX"; exit 1
            fi
            WHERE=(--bbox "$BBOX" --name "$PLACE")
          else
            WHERE=(--place "$PLACE")
          fi
          if [ -n "$ORIGIN" ]; then
            if ! [[ "$ORIGIN" =~ ^-?[0-9.]+,-?[0-9.]+$ ]]; then
              echo "origin must be lat,lon in degrees, got: $ORIGIN"; exit 1
            fi
            WHERE+=(--origin "$ORIGIN")
          fi
          if [ "$BARE" = "true" ]; then
            WHERE+=(--bare-ground)
          fi
          if [ -n "$INCLUDE" ]; then
            python3 tools/osm_city.py "${WHERE[@]}" --margin "$MARGIN" --include "$INCLUDE" --out "$OUT"
          else
            python3 tools/osm_city.py "${WHERE[@]}" --margin "$MARGIN" --out "$OUT"
          fi

      - name: commit the city file
        env:
          PLACE: ${{ inputs.place }}
          OUT: ${{ inputs.out }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "the city file did not change"; exit 0
          fi
          git commit -m "bake $PLACE from OpenStreetMap"
          # someone may push to the branch between the pull and the push (a session working
          # on it): pull and push again rather than lose the bake
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: re-publish the web build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
